<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>The front door as a string diagram</title><desc>A request, with the conversation so far, goes to Claude, which answers. loom checks the answer and compiles its program to a plan. The plan is copied: one copy is shown and kept for Run, the other goes to needs, then to ready, which reads the worker. Nothing runs: Run is the ordinary run of the program.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="d" x="60" y="66" width="600" height="352" rx="12"/><text class="l" x="64" y="56" text-anchor="start">loom: ask (nothing runs)</text><path class="w" d="M360 30 L360 90"/><text class="l" x="370" y="52" text-anchor="start">request, earlier turns, today, time zone</text><g class="c"><rect x="270" y="90" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="360.0" y="105" text-anchor="middle" dominant-baseline="central">ask</text><text class="t2" x="360.0" y="124" text-anchor="middle" dominant-baseline="central">Claude, one JSON object</text></g><path class="w" d="M360 138 L360 166"/><text class="l" x="370" y="156" text-anchor="start">answer</text><g class="p"><rect x="270" y="166" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="360.0" y="181" text-anchor="middle" dominant-baseline="central">check ; compile</text><text class="t2" x="360.0" y="200" text-anchor="middle" dominant-baseline="central">draft, as a run compiles</text></g><path class="w" d="M360 214 L360 238"/><circle class="dot" cx="360" cy="242" r="4.5"/><path class="w" d="M356 244 C 300 260, 180 254, 180 280 L 180 380"/><text class="l" x="190" y="330" text-anchor="start">plan (drawn; Run)</text><path class="w" d="M364 244 C 420 260, 520 254, 520 270"/><g class="p"><rect x="430" y="270" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="520.0" y="285" text-anchor="middle" dominant-baseline="central">needs</text><text class="t2" x="520.0" y="304" text-anchor="middle" dominant-baseline="central">connectors · Claude · image</text></g><path class="w" d="M520 318 L520 340"/><g class="g"><rect x="430" y="340" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="520.0" y="355" text-anchor="middle" dominant-baseline="central">ready</text><text class="t2" x="520.0" y="374" text-anchor="middle" dominant-baseline="central">the worker, as a step reads it</text></g><path class="w" d="M180 380 L180 440" marker-end="url(#a)"/><path class="w" d="M520 388 L520 440" marker-end="url(#a)"/><text class="l" x="180" y="458" text-anchor="middle">proposal</text><text class="l" x="520" y="458" text-anchor="middle">readiness</text><text class="f" x="360" y="496" text-anchor="middle">propose = ask ; check ; compile ; Δ ; (id ⊗ (needs ; ready))</text><text class="f" x="360" y="520" text-anchor="middle">needs(f ; g) = needs(f) ∪ needs(g) = needs(f ⊗ g)   ·   ready(f ; g) = ready(f) ∧ ready(g)</text><text class="l" x="360" y="548" text-anchor="middle">Run submits the program, which compiles again to the same plan (law 18): the card shows what runs.</text><text class="l" x="360" y="574" text-anchor="middle">Orange: Claude · Purple: computation · Teal: the worker · Dot: Δ (copy) · Side by side: ⊗ · Below: ;</text></svg>