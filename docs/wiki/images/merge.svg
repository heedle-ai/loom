<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img"><title>Branching and merging agent history</title><desc>Top: a what-if branch splits off main, runs on both continue, a merge commit joins them, and a re-run settles the conflicting question. Bottom: the beliefs indexes of the common ancestor, ours and theirs go into Git's three-way merge; a question changed on one side takes that side's whole run, a question both sides changed differently is a conflict resolved with ours, theirs or a re-run.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="l" x="30" y="52" text-anchor="start">refs/loom/runs</text><g class="p"><rect x="30" y="66" width="110" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="85.0" y="81.0" text-anchor="middle" dominant-baseline="central">run</text><text class="t2" x="85.0" y="100.0" text-anchor="middle" dominant-baseline="central">both delays</text></g><path class="w" d="M140 90 L230 90"/><g class="p"><rect x="230" y="66" width="110" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="285.0" y="81.0" text-anchor="middle" dominant-baseline="central">run</text><text class="t2" x="285.0" y="100.0" text-anchor="middle" dominant-baseline="central">storm passes</text></g><path class="w" d="M340 90 L420 90"/><g class="g"><rect x="420" y="66" width="110" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="475.0" y="81.0" text-anchor="middle" dominant-baseline="central">merge</text><text class="t2" x="475.0" y="100.0" text-anchor="middle" dominant-baseline="central">ours ⊗ theirs</text></g><path class="w" d="M530 90 L560 90"/><g class="p"><rect x="560" y="66" width="100" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="610.0" y="81.0" text-anchor="middle" dominant-baseline="central">re-run</text><text class="t2" x="610.0" y="100.0" text-anchor="middle" dominant-baseline="central">the conflict</text></g><circle class="dot" cx="140" cy="90" r="4.5"/><path class="w" d="M140 94 C 140 150, 150 180, 170 180"/><g class="p"><rect x="170" y="156" width="110" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="225.0" y="171.0" text-anchor="middle" dominant-baseline="central">run</text><text class="t2" x="225.0" y="190.0" text-anchor="middle" dominant-baseline="central">factory fixed?</text></g><path class="w" d="M280 180 L300 180"/><g class="p"><rect x="300" y="156" width="110" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="355.0" y="171.0" text-anchor="middle" dominant-baseline="central">run</text><text class="t2" x="355.0" y="190.0" text-anchor="middle" dominant-baseline="central">new question</text></g><path class="w" d="M410 180 C 460 180, 475 160, 475 116" marker-end="url(#a)"/><text class="l" x="170" y="228" text-anchor="start">refs/loom/what-if</text><text class="f" x="340" y="262" text-anchor="middle">A merge commit has both heads as parents: every run of both sides stays in the history.</text><rect class="d" x="30" y="284" width="620" height="266" rx="12"/><text class="l" x="42" y="278" text-anchor="start">the merge commit's beliefs/ index</text><g class="n"><rect x="60" y="302" width="160" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="140.0" y="315.0" text-anchor="middle" dominant-baseline="central">base index</text><text class="t2" x="140.0" y="334.0" text-anchor="middle" dominant-baseline="central">common ancestor</text></g><g class="n"><rect x="260" y="302" width="160" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="315.0" text-anchor="middle" dominant-baseline="central">ours index</text><text class="t2" x="340.0" y="334.0" text-anchor="middle" dominant-baseline="central">beliefs/ on main</text></g><g class="n"><rect x="460" y="302" width="160" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="540.0" y="315.0" text-anchor="middle" dominant-baseline="central">theirs index</text><text class="t2" x="540.0" y="334.0" text-anchor="middle" dominant-baseline="central">beliefs/ on what-if</text></g><path class="w" d="M140 346 C 140 366, 260 366, 270 384"/><path class="w" d="M340 346 L340 384"/><path class="w" d="M540 346 C 540 366, 420 366, 410 384"/><g class="g"><rect x="180" y="384" width="320" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="399.0" text-anchor="middle" dominant-baseline="central">git merge-tree</text><text class="t2" x="340.0" y="418.0" text-anchor="middle" dominant-baseline="central">Git's three-way merge, path = question</text></g><circle class="dot" cx="340" cy="452" r="4.5"/><path class="w" d="M340 432 L340 448"/><path class="w" d="M336 455 C 300 470, 200 466, 200 482"/><path class="w" d="M344 455 C 380 470, 480 466, 480 482"/><g class="p"><rect x="90" y="482" width="220" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="200.0" y="497.0" text-anchor="middle" dominant-baseline="central">one side changed</text><text class="t2" x="200.0" y="516.0" text-anchor="middle" dominant-baseline="central">take that side's whole run</text></g><g class="c"><rect x="370" y="482" width="220" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="480.0" y="497.0" text-anchor="middle" dominant-baseline="central">both changed differently</text><text class="t2" x="480.0" y="516.0" text-anchor="middle" dominant-baseline="central">conflict: ours, theirs or re-run</text></g><text class="f" x="340" y="574" text-anchor="middle">Each belief is a whole run, so a merge never pairs one run's evidence with another's conclusion.</text></svg>
