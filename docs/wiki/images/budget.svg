<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img"><title>A scheduled run with a budget, as a string diagram</title><desc>A run a schedule started first goes to budget, which reads the schedule's runs this month from their records and the prices. Under the budget, the run goes on exactly as any run: check, then the plan, then the record. At or over it, or if the month can't be priced, the run stops: the schedule is paused with a note, no step starts and nothing is recorded. scheduled run = budget ; (run + stop).</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><rect class="d" x="60" y="66" width="600" height="360" rx="12"/><text class="l" x="64" y="56" text-anchor="start">loom: a run a schedule started</text><path class="w" d="M360 30 L360 100"/><text class="l" x="370" y="52" text-anchor="start">the run's input, its schedule's name</text><path class="w" d="M215 130 L270 130"/><text class="l" x="76" y="122" text-anchor="start">this month's records</text><text class="l" x="76" y="140" text-anchor="start">(schedule's time zone)</text><path class="w" d="M540 130 L450 130"/><text class="l" x="550" y="122" text-anchor="start">prices</text><text class="l" x="550" y="140" text-anchor="start">(est., as of a date)</text><g class="g"><rect x="270" y="100" width="180" height="60" rx="6" stroke-width="0.8"/><text class="t1" x="360" y="120" text-anchor="middle" dominant-baseline="central">budget</text><text class="t2" x="360" y="141" text-anchor="middle" dominant-baseline="central">under it? priced?</text></g><text class="f" x="360" y="196" text-anchor="middle">+</text><path class="w" d="M330 160 L330 175 L220 190 L220 240"/><text class="l" x="120" y="218" text-anchor="start">under budget</text><path class="w" d="M390 160 L390 175 L500 190 L500 240"/><text class="l" x="510" y="218" text-anchor="start">at or over, or unpriced</text><g class="p"><rect x="130" y="240" width="180" height="60" rx="6" stroke-width="0.8"/><text class="t1" x="220" y="260" text-anchor="middle" dominant-baseline="central">run</text><text class="t2" x="220" y="281" text-anchor="middle" dominant-baseline="central">check ; plan ; writes</text></g><g class="c"><rect x="410" y="240" width="180" height="60" rx="6" stroke-width="0.8"/><text class="t1" x="500" y="260" text-anchor="middle" dominant-baseline="central">stop</text><text class="t2" x="500" y="281" text-anchor="middle" dominant-baseline="central">pause, with the note</text></g><path class="w" d="M220 300 L220 340"/><g class="n"><rect x="130" y="340" width="180" height="60" rx="6" stroke-width="0.8"/><text class="t1" x="220" y="360" text-anchor="middle" dominant-baseline="central">record</text><text class="t2" x="220" y="381" text-anchor="middle" dominant-baseline="central">Loom-Schedule: name</text></g><path class="w" d="M500 300 L500 360"/><text class="l" x="510" y="350" text-anchor="start">no step, no record</text><path class="w" d="M220 400 L220 470"/><text class="l" x="230" y="455" text-anchor="start">a run like any other</text><text class="l" x="440" y="470" text-anchor="start">scheduled run = budget ; (run + stop)</text></svg>
