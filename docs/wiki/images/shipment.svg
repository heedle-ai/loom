<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>String diagram of the shipment program</title><desc>The input is copied three ways. The copies go side by side into weather, carrier and factory, which join into assess.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path class="w" d="M340 30 L340 66"/><text class="l" x="350" y="48" text-anchor="start">input</text><circle class="dot" cx="340" cy="70" r="4.5"/><text class="l" x="366" y="74" text-anchor="start">Δ₃</text><path class="w" d="M336 72 C 300 90, 180 86, 180 120"/><path class="w" d="M340 75 L340 120"/><path class="w" d="M344 72 C 380 90, 500 86, 500 120"/><rect class="d" x="100" y="104" width="480" height="96" rx="12"/><text class="f" x="592" y="156" text-anchor="start">⊗</text><g class="p"><rect x="120" y="120" width="120" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="180.0" y="139.0" text-anchor="middle" dominant-baseline="central">n0 weather</text><text class="t2" x="180.0" y="158.0" text-anchor="middle" dominant-baseline="central">source</text></g><g class="p"><rect x="280" y="120" width="120" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="139.0" text-anchor="middle" dominant-baseline="central">n1 carrier</text><text class="t2" x="340.0" y="158.0" text-anchor="middle" dominant-baseline="central">source</text></g><g class="p"><rect x="440" y="120" width="120" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="500.0" y="139.0" text-anchor="middle" dominant-baseline="central">n2 factory</text><text class="t2" x="500.0" y="158.0" text-anchor="middle" dominant-baseline="central">source</text></g><path class="w" d="M180 176 L 180 214 C 180 240, 300 236, 320 256"/><path class="w" d="M340 176 L340 256"/><path class="w" d="M500 176 L 500 214 C 500 240, 380 236, 360 256"/><g class="g"><rect x="250" y="256" width="180" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="275.0" text-anchor="middle" dominant-baseline="central">n3 assess</text><text class="t2" x="340.0" y="294.0" text-anchor="middle" dominant-baseline="central">joins inputs by node ID</text></g><path class="w" d="M340 312 L340 342" marker-end="url(#a)"/><text class="l" x="350" y="336" text-anchor="start">verdict</text><text class="f" x="340" y="378" text-anchor="middle">shipment = Δ₃ ; (weather ⊗ carrier ⊗ factory) ; assess</text></svg>
