<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img"><title>A heedle-ai run as a string diagram</title><desc>The source is copied; one copy is kept as the program, the other is compiled to a plan. The plan is copied; one copy is kept, the other is executed by shuttle on Temporal. Program, plan and outputs feed record, which appends a commit to warp. The commit feeds the read-only drawdown view.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="d" x="100" y="70" width="550" height="322" rx="12"/><text class="l" x="104" y="60" text-anchor="start">loom: run</text><path class="w" d="M340 40 L340 78"/><text class="l" x="350" y="56" text-anchor="start">source</text><circle class="dot" cx="340" cy="82" r="4.5"/><path class="w" d="M336 84 C 300 102, 160 96, 160 130 L 160 330"/><text class="l" x="170" y="240" text-anchor="start">program</text><path class="w" d="M344 84 C 372 96, 400 96, 400 110"/><g class="p"><rect x="330" y="110" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="400.0" y="125.0" text-anchor="middle" dominant-baseline="central">compile</text><text class="t2" x="400.0" y="144.0" text-anchor="middle" dominant-baseline="central">draft</text></g><path class="w" d="M400 158 L400 196"/><circle class="dot" cx="400" cy="200" r="4.5"/><path class="w" d="M400 204 L400 330"/><text class="l" x="410" y="290" text-anchor="start">plan</text><path class="w" d="M404 202 C 440 212, 560 206, 560 226"/><g class="p"><rect x="480" y="226" width="160" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="560.0" y="241.0" text-anchor="middle" dominant-baseline="central">⟦–⟧ execute</text><text class="t2" x="560.0" y="260.0" text-anchor="middle" dominant-baseline="central">shuttle on Temporal</text></g><path class="w" d="M560 274 L560 330"/><text class="l" x="570" y="306" text-anchor="start">outputs</text><g class="g"><rect x="120" y="330" width="520" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="380.0" y="345.0" text-anchor="middle" dominant-baseline="central">record</text><text class="t2" x="380.0" y="364.0" text-anchor="middle" dominant-baseline="central">warp · Git, append only</text></g><path class="w" d="M380 378 L380 420"/><text class="l" x="390" y="404" text-anchor="start">commit</text><g class="g"><rect x="295" y="420" width="170" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="380.0" y="435.0" text-anchor="middle" dominant-baseline="central">view</text><text class="t2" x="380.0" y="454.0" text-anchor="middle" dominant-baseline="central">drawdown, read-only</text></g><path class="w" d="M380 468 L380 496" marker-end="url(#a)"/><text class="l" x="390" y="490" text-anchor="start">page</text><text class="f" x="340" y="526" text-anchor="middle">run = Δ ; (id ⊗ (compile ; Δ ; (id ⊗ ⟦–⟧))) ; record</text><text class="l" x="340" y="552" text-anchor="middle">Purple: computation · Teal: the Git store · Dot: Δ (copy) · Side by side: ⊗ · Below: ;</text></svg>
