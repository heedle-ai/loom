name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step
    # (the default, bash -e, ignores it).
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: loom
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/warp
          path: warp
      - name: sibling-bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
      - name: sibling-reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
      - name: sibling-pirn
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/pirn
          path: pirn
      - name: sibling-treadle
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/treadle
          path: treadle
      - uses: actions/setup-go@v5
        with:
          go-version-file: loom/go.mod
          cache-dependency-path: loom/go.sum
      - name: gofmt
        working-directory: loom
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: loom
        run: go vet ./...
      - name: test
        working-directory: loom
        run: go test -race ./...
      - name: invariants
        working-directory: loom
        run: bash .github/invariants.sh
      - name: workflowcheck
        working-directory: loom
        run: go run go.temporal.io/sdk/contrib/tools/workflowcheck@v0.6.0 ./...
      - name: e2e
        # A real Temporal dev server (StartDevServer downloads the CLI).
        working-directory: loom
        env:
          LOOM_E2E: "1"
        run: |
          go test -count=1 -v -run 'TestE2E_' . | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestE2E_ARealServer' e2e.log
          grep -q -- '--- PASS: TestE2E_CancelStopsTheStep' e2e.log
          grep -q -- '--- PASS: TestE2E_BudgetPausesASchedule' e2e.log
